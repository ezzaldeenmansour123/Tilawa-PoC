name: Build Tilawa PoC APK

# Manual trigger ONLY. This workflow builds the standalone PoC app
# (com.tilawa.app.tilawa_poc) — it never touches the main Tilawa app,
# never pushes to any branch, and publishes only a `poc-N` release
# artifact for on-device testing by the user.
#
# Mirrors the main Tilawa build.yml pattern (flutter create + manifest
# patching) because, like Tilawa, this repo has no committed android/
# folder: the Android project is generated in CI.

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Model tier to bundle (lite first)"
        required: true
        default: "lite"
        type: choice
        options: [lite, full]

permissions:
  contents: write

jobs:
  # 0. Verify the JS bridge API against the real engine in Node, BEFORE
  #    building any APK. A headless load of the lite model with a silence
  #    WAV proves createTilawa/loadWebModel/startSession exist with the
  #    signatures web/src/bridge.js uses. If this fails, the APK is not built.
  node-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download lite model + reference (SHA-verified)
        run: |
          python3 tools/download_assets.py --tier lite --out /tmp/poc-models
          python3 tools/check_ref_schema.py /tmp/poc-models/ref-v2.json
          # Lay the files out exactly like the tilawa.dev hosting layout.
          # loadNodeModel(dir) reads dir/manifest.json and then loads
          # dir/<manifest.file> — so `dir` must be the model VERSION
          # directory itself (models/<id>/<version>), NOT the host root:
          # the host root has no manifest.json, which is why run #2 failed
          # with ENOENT on /tmp/poc-host/manifest.json.
          mkdir -p /tmp/poc-host/models/spliced-clean-lite/1-int8 /tmp/poc-host/reference
          cp /tmp/poc-models/model-lite.onnx /tmp/poc-host/models/spliced-clean-lite/1-int8/model.onnx
          cp /tmp/poc-models/manifest-lite.json /tmp/poc-host/models/spliced-clean-lite/1-int8/manifest.json
          cp /tmp/poc-models/ref-v2.json /tmp/poc-host/reference/ref-v2.json
      - name: Install engine + runtime
        run: |
          cd web
          # `npm install`, not `npm ci`: there is no package-lock.json yet
          # (no Node toolchain was available when the PoC was scaffolded).
          # The first green build MUST commit the generated lock file.
          npm install
          npm run build
          test -s ../assets/web/bundle.js
      - name: Node smoke test (load model, silence session)
        run: |
          node --input-type=module -e "
            import { createTilawa, loadNodeModel } from '@tilawa/core/node';
            const model = await loadNodeModel('/tmp/poc-host/models/spliced-clean-lite/1-int8');
            const tilawa = await createTilawa({ model });
            const session = tilawa.startFreeRecitation();
            const events = [];
            session.subscribe((e) => events.push(e.type));
            const silence = new Float32Array(16000); // 1 s of silence
            session.pushAudio(silence, 16000);
            await session.end();
            await tilawa.dispose();
            console.log('events:', JSON.stringify(events));
            if (!events.includes('capabilities')) throw new Error('no capabilities event');
            console.log('NODE SMOKE OK');
          "
        working-directory: web

  build:
    needs: node-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 21, not 17: AGP 9.3.1's lint (lintVitalAnalyzeRelease) calls
      # java.util.List.removeLast() (a Java 21 SequencedCollection API)
      # while analysing webview_flutter_android's generated .g.kt file,
      # and crashes with NoSuchMethodError on JDK 17 (run #8).
      # Flutter 3.50.1 / Gradle 9.5 run fine on JDK 21.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter 3.50.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable

      - name: Set up Node 20 (web bundle)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build web bundle
        run: |
          cd web
          npm install
          npm run build
          ls -lh ../assets/web/bundle.js

      - name: Download model assets (SHA-verified)
        run: |
          python3 tools/download_assets.py --tier ${{ inputs.tier }} --out assets/models
          python3 tools/check_ref_schema.py assets/models/ref-v2.json
          ls -lh assets/models/

      - name: Create Android project files
        run: |
          flutter create --platforms=android --org com.tilawa.app --project-name tilawa_poc .
          # flutter create generates a default test/widget_test.dart that
          # references a MyApp class this project does not have (and imports
          # material_ui without it being a dependency) — it breaks
          # `flutter analyze` (run #3). This PoC's tests live in
          # test/event_log_test.dart; delete the generated file.
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          t = p.read_text(encoding='utf-8')
          t = t.replace('android:label="tilawa_poc"', 'android:label="Tilawa PoC"')
          perms = ('    <uses-permission android:name="android.permission.INTERNET"/>\n'
                   '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n')
          assert 'android.permission.RECORD_AUDIO' not in t
          t = t.replace('</manifest>', perms + '</manifest>')
          p.write_text(t, encoding='utf-8')
          print('manifest OK')
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK (arm64 only, for the test phone)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tilawa-poc-apk-${{ inputs.tier }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Publish PoC release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: poc-${{ github.run_number }}
          name: Tilawa PoC ${{ github.run_number }} (${{ inputs.tier }})
          body: |
            Standalone PoC build — NOT the Tilawa app.
            Model tier: ${{ inputs.tier }}. Installs as com.tilawa.app.tilawa_poc
            (does not replace Tilawa). See docs/PHONE_TEST_PROTOCOL.md for the
            on-device test steps. Results go in POC_RESULTS_YYYY-MM-DD.md.
          files: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

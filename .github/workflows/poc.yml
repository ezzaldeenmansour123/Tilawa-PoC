name: Build Tilawa PoC APK

# Manual trigger ONLY. This workflow builds the standalone PoC app
# (com.tilawa.app.tilawa_poc) — it never touches the main Tilawa app,
# never pushes to any branch, and publishes only a `poc-N` release
# artifact for on-device testing by the user.
#
# Mirrors the main Tilawa build.yml pattern (flutter create + manifest
# patching) because, like Tilawa, this repo has no committed android/
# folder: the Android project is generated in CI.

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Model tier to bundle (lite first)"
        required: true
        default: "lite"
        type: choice
        options: [lite, full]

permissions:
  contents: write

jobs:
  # 0. Verify the JS bridge API against the real engine in Node, BEFORE
  #    building any APK. A headless load of the lite model with a silence
  #    WAV proves createTilawa/loadWebModel/startSession exist with the
  #    signatures web/src/bridge.js uses. If this fails, the APK is not built.
  node-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download lite + full models + reference (SHA-verified)
        run: |
          python3 tools/download_assets.py --tier lite --out /tmp/poc-models
          # FULL model too (67.8 MB in CI is acceptable): the ONNX I/O
          # check below must verify BOTH tiers independently — a lite-only
          # check can never catch a full-model I/O mismatch.
          python3 tools/download_assets.py --tier full --out /tmp/poc-models
          python3 tools/check_ref_schema.py /tmp/poc-models/ref-v2.json
          # Lay the files out exactly like the tilawa.dev hosting layout.
          # loadNodeModel(dir) reads dir/manifest.json and then loads
          # dir/<manifest.file> — so `dir` must be the model VERSION
          # directory itself (models/<id>/<version>), NOT the host root:
          # the host root has no manifest.json, which is why run #2 failed
          # with ENOENT on /tmp/poc-host/manifest.json.
          mkdir -p /tmp/poc-host/models/spliced-clean-lite/1-int8 /tmp/poc-host/models/spliced-clean/1-int8 /tmp/poc-host/reference
          cp /tmp/poc-models/model-lite.onnx /tmp/poc-host/models/spliced-clean-lite/1-int8/model.onnx
          cp /tmp/poc-models/manifest-lite.json /tmp/poc-host/models/spliced-clean-lite/1-int8/manifest.json
          cp /tmp/poc-models/model-full.onnx /tmp/poc-host/models/spliced-clean/1-int8/model.onnx
          cp /tmp/poc-models/manifest-full.json /tmp/poc-host/models/spliced-clean/1-int8/manifest.json
          cp /tmp/poc-models/ref-v2.json /tmp/poc-host/reference/ref-v2.json
      - name: Install engine + runtime
        run: |
          cd web
          # `npm ci`, not `npm install`: web/package-lock.json pins every
          # dependency (generated 2026-11-25, Phase 2 item 2.4), so CI
          # installs exactly the versions tested locally.
          npm ci
          npm run build
          test -s ../assets/web/bundle.js
          # Actually EVALUATE the bundle in Node (web/smoke-bundle.mjs):
          # `test -s` only proves the file is non-empty — a bundle that
          # throws during evaluation dies before defining window.TilawaPoc
          # (the poc-14 failure mode) and would still pass `test -s`.
          node smoke-bundle.mjs
      - name: Node smoke test (load model, silence session)
        run: |
          node --input-type=module -e "
            import { createTilawa, loadNodeModel } from '@tilawa/core/node';
            const model = await loadNodeModel('/tmp/poc-host/models/spliced-clean-lite/1-int8');
            const tilawa = await createTilawa({ model });
            const session = tilawa.startFreeRecitation();
            const events = [];
            session.subscribe((e) => events.push(e.type));
            const silence = new Float32Array(16000); // 1 s of silence
            session.pushAudio(silence, 16000);
            await session.end();
            await tilawa.dispose();
            console.log('events:', JSON.stringify(events));
            if (!events.includes('capabilities')) throw new Error('no capabilities event');
            console.log('NODE SMOKE OK');
          "
        working-directory: web

      # ONNX I/O verification (2026-11-26, user directive): model-load
      # success is NOT proof tasmee' works. web/check_onnx_io.mjs creates
      # a REAL onnxruntime-node InferenceSession per tier and checks the
      # session's input/output names, dtypes and shapes against exactly
      # what @tilawa/core feeds and reads (x [1,45,80] + manifest states
      # in, log_probs + new_* states out), then runs the web warmup probe.
      # Runs for BOTH tiers independently; any mismatch fails the job.
      # DEV ENVIRONMENT ONLY: a pass here answers "does the session
      # create and does the I/O match" — it NEVER proves tasmee' works on
      # the phone (that is the separate on-device phone protocol).
      - name: ONNX I/O check (both tiers)
        run: |
          node check_onnx_io.mjs \
            --model /tmp/poc-host/models/spliced-clean-lite/1-int8/model.onnx \
            --manifest /tmp/poc-host/models/spliced-clean-lite/1-int8/manifest.json \
            --tier lite
          node check_onnx_io.mjs \
            --model /tmp/poc-host/models/spliced-clean/1-int8/model.onnx \
            --manifest /tmp/poc-host/models/spliced-clean/1-int8/manifest.json \
            --tier full
        working-directory: web

  build:
    needs: node-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 21, not 17: AGP 9.3.1's lint (lintVitalAnalyzeRelease) calls
      # java.util.List.removeLast() (a Java 21 SequencedCollection API)
      # while analysing webview_flutter_android's generated .g.kt file,
      # and crashes with NoSuchMethodError on JDK 17 (run #8).
      # Flutter 3.50.1 / Gradle 9.5 run fine on JDK 21.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Stable debug keystore — why: each GitHub runner generates a fresh
      # ~/.android/debug.keystore, so every build had a DIFFERENT signature
      # (proven 2026-11-25: pro-build-25, poc-14 and poc-15 all carry
      # different certificates). Android refuses to update an installed app
      # with a different signature, so a new build could not install over
      # the previous one ("package appears to be invalid"). This step creates
      # ONE keystore on the first run, commits it to tools/debug.keystore,
      # and reuses it for every later build — so updates work from the next
      # build on. It is a DEBUG (trial) key with the public standard
      # credentials (android/androiddebugkey/android): it provides install
      # identity only, no security. A real release key (in GitHub Secrets)
      # must replace it before any store release.
      - name: Ensure stable debug keystore
        run: |
          KEYSTORE=tools/debug.keystore
          if [ -f "$KEYSTORE" ]; then
            echo 'Using committed stable debug keystore.'
          else
            echo 'No stable debug keystore yet — generating one (first run only).'
            keytool -genkeypair -v -keystore "$KEYSTORE" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname 'CN=Android Debug, O=Android, C=US'
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add "$KEYSTORE"
            git commit -m 'Add stable debug keystore so trial builds keep one signature [skip ci]' || echo 'nothing to commit'
            git push origin HEAD:main || {
              echo 'push failed — another run may have created it; taking the committed one'
              git fetch origin main
              git checkout origin/main -- "$KEYSTORE"
            }
          fi
          mkdir -p ~/.android
          cp "$KEYSTORE" ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | head -4

      - name: Set up Flutter 3.50.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable

      - name: Set up Node 20 (web bundle)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build web bundle
        run: |
          cd web
          # `npm ci` (pinned by web/package-lock.json, Phase 2 item 2.4).
          npm ci
          npm run build
          # `test -s` HERE in the build job itself (not only in node-smoke
          # on another runner): a missing/empty bundle must fail this job.
          test -s ../assets/web/bundle.js
          # Evaluate the bundle for real — see node-smoke above.
          node smoke-bundle.mjs
          ls -lh ../assets/web/bundle.js

      - name: Download model assets (SHA-verified)
        run: |
          python3 tools/download_assets.py --tier ${{ inputs.tier }} --out assets/models
          python3 tools/check_ref_schema.py assets/models/ref-v2.json
          ls -lh assets/models/

      - name: Create Android project files
        run: |
          flutter create --platforms=android --org com.tilawa.app --project-name tilawa_poc .
          # flutter create generates a default test/widget_test.dart that
          # references a MyApp class this project does not have (and imports
          # material_ui without it being a dependency) — it breaks
          # `flutter analyze` (run #3). This PoC's tests live in
          # test/event_log_test.dart; delete the generated file.
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          t = p.read_text(encoding='utf-8')
          # ROOT FIX (diagnosed 2026-11-25 23:41, from the user's screenshots):
          # WebView failed with net::ERR_CLEARTEXT_NOT_PERMITTED on
          # http://127.0.0.1:<port>/tilawa.html — Android 9+ blocks cleartext
          # (plain HTTP) by default, so the recitation page never loaded at
          # all, bundle.js never ran, and the bridge never existed. That one
          # block is the root of the poc-12 timeout, the poc-14 bundle.js
          # error and the pro-build-24 bundle.js error. The fix is a network
          # security config that allows cleartext ONLY to the on-device local
          # server (127.0.0.1 / localhost) — the LocalServer binds loopback
          # only and serves the engine page, bundle and model files. No
          # other host is allowed cleartext. (A broad
          # android:usesCleartextTraffic="true" would also work but permits
          # cleartext everywhere — deliberately NOT used.)
          t = t.replace('android:label="tilawa_poc"',
                        'android:label="Tilawa PoC"\n'
                        '        android:networkSecurityConfig="@xml/network_security_config"')
          assert 'android:networkSecurityConfig="@xml/network_security_config"' in t
          xml = Path('android/app/src/main/res/xml/network_security_config.xml')
          xml.parent.mkdir(parents=True, exist_ok=True)
          xml.write_text('<?xml version="1.0" encoding="utf-8"?>\n'
                         '<!-- Cleartext ONLY to the on-device local server. -->\n'
                         '<network-security-config>\n'
                         '  <domain-config cleartextTrafficPermitted="true">\n'
                         '    <domain includeSubdomains="true">127.0.0.1</domain>\n'
                         '    <domain includeSubdomains="true">localhost</domain>\n'
                         '  </domain-config>\n'
                         '</network-security-config>\n', encoding='utf-8')
          print('network security config OK (cleartext to 127.0.0.1/localhost only)')
          perms = ('    <uses-permission android:name="android.permission.INTERNET"/>\n'
                   '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n')
          assert 'android.permission.RECORD_AUDIO' not in t
          t = t.replace('</manifest>', perms + '</manifest>')
          p.write_text(t, encoding='utf-8')
          print('manifest OK')
          # `record` (native mic capture) needs minSdk 23 (its README);
          # the flutter-create template defaults to flutter.minSdkVersion
          # (21). Bump it so the Gradle build does not fail on the
          # manifest merger ("uses-sdk:minSdkVersion 21 cannot be
          # smaller than version 23").
          import re
          g = Path('android/app/build.gradle.kts')
          gt = g.read_text(encoding='utf-8')
          gt, _min_sdk_n = re.subn(r'minSdk = .*', 'minSdk = 23', gt, count=1)
          assert _min_sdk_n == 1, 'minSdk line not found in build.gradle.kts'
          g.write_text(gt, encoding='utf-8')
          print('minSdk set to 23 (record plugin)')
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK (arm64 only, for the test phone)
        run: flutter build apk --release --split-per-abi

      # The bundle was built and smoke-tested above, but that proves only
      # that it exists on the runner — not that Flutter packaged it into
      # the APK. A missing asset here is exactly the poc-14 failure mode
      # (HTTP 500 from the local server, no bridge in the page).
      - name: Verify bundle.js inside APK (fail if missing or tiny)
        run: |
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          entry=$(unzip -l "$apk" | grep 'assets/flutter_assets/assets/web/bundle.js' || true)
          if [ -z "$entry" ]; then
            echo "ERROR: assets/flutter_assets/assets/web/bundle.js is NOT inside $apk — the local server would serve nothing and WebView init would fail (poc-14)."
            unzip -l "$apk" | grep 'assets/web/' || echo '(no assets/web/ entries in APK at all)'
            exit 1
          fi
          size=$(echo "$entry" | awk '{print $1}')
          echo "bundle.js inside APK: $size bytes (uncompressed)"
          if [ "$size" -lt 512000 ]; then
            echo "ERROR: bundle.js inside APK is only $size bytes (minimum 512000) — suspiciously small for the minified @tilawa/core + onnxruntime-web bundle (measured 1040578 bytes on 2026-11-25)."
            exit 1
          fi
          echo 'bundle.js inside APK OK'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tilawa-poc-apk-${{ inputs.tier }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Publish PoC release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: poc-${{ github.run_number }}
          name: Tilawa PoC ${{ github.run_number }} (${{ inputs.tier }})
          body: |
            Standalone PoC build — NOT the Tilawa app.
            Model tier: ${{ inputs.tier }}. Installs as com.tilawa.app.tilawa_poc
            (does not replace Tilawa). See docs/PHONE_TEST_PROTOCOL.md for the
            on-device test steps. Results go in POC_RESULTS_YYYY-MM-DD.md.
          files: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilawa PoC — التسميع الذكي</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 24px; background: #f7f5ef; color: #222; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .muted { color: #666; font-size: 14px; }
  #status { font-weight: bold; }
</style>
</head>
<body>
  <div class="card">
    <div id="status">جارٍ تحميل محرك التسميع…</div>
    <p class="muted">مساعد حفظ تجريبي — يكشف أخطاء الحفظ فقط، لا يقيّم التجويد أو النطق؛ حفص فقط؛ قد يخطئ؛ الصوت لا يغادر جهازك.</p>
    <p class="muted" id="detail">يُقدَّم هذا الصفحة من خادم محلي (http://127.0.0.1) داخل التطبيق — السياق الآمن المطلوب للميكروفون.</p>
  </div>
  <script>
    // Permanent diagnostics (TASMEE Phase 2, item 2.3): if bundle.js
    // throws while being evaluated, window.TilawaPoc is never defined
    // and Dart hears nothing (Phase 1 §2.2 — the strongest poc-14
    // hypothesis). This handler is registered BEFORE the bundle loads,
    // so it can forward the first such error while the bridge is still
    // undefined. Guarded: diagnostics must never break the page.
    window.addEventListener('error', function (e) {
      try {
        if (typeof window.TilawaPoc === 'undefined' && window.TilawaBridge) {
          window.TilawaBridge.postMessage(JSON.stringify({ type: 'js-error', message: 'خطأ أثناء تقييم حزمة المحرك (bundle.js): ' + (e.message || 'خطأ غير معروف') }));
        }
      } catch (_) { /* never break the page from diagnostics */ }
    });
  </script>
  <script src="/bundle.js" onerror="if(window.TilawaBridge){window.TilawaBridge.postMessage(JSON.stringify({type:'bundle-load-error',message:'فشل تحميل حزمة المحرك (bundle.js) من الخادم المحلي — تحقق من بناء الحزمة ثم أعد تشغيل التطبيق.'}));}document.getElementById('status').textContent='تعذّر تحميل حزمة المحرك (bundle.js).';"></script>
  <script>
    // The Dart side calls window.TilawaPoc.init(...) after load.
    // This page intentionally shows almost nothing: the Flutter UI is the
    // interface; the WebView is only the engine host.
    document.getElementById('status').textContent = 'المحرك جاهز للتهيئة من التطبيق.';
    if (window.TilawaBridge) {
      window.TilawaBridge.postMessage(JSON.stringify({ type: 'page-loaded' }));
    }
  </script>
</body>
</html>
